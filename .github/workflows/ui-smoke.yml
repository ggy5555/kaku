name: KAKU UI Smoke

on:
  push:
    branches: [design/kaku-writing-studio]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Serve KAKU locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kaku-server.log 2>&1 &
          sleep 2
      - name: Browser smoke tests
        run: node tests/browser-smoke.cjs
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaku-ui-smoke-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
